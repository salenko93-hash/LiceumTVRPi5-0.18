<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>LyceumTV 4.0 · Preview розкладу</title><link rel="stylesheet" href="/css/tv4-preview.css"></head>
<body><div id="tv4-viewport"><main id="tv4-screen" aria-label="Поточний розклад восьми класів">

<footer class="tv4-footer"><span id="tv4-duty">ЧЕРГОВИЙ КЛАС: —</span><span id="tv4-connection">ПІДКЛЮЧЕННЯ…</span><span class="tv4-preview-label">TV 4.0 · ПЕРЕДПЕРЕГЛЯД</span></footer>
<div id="tv4-special" class="tv4-special" hidden><div class="tv4-special-logo">ЦЕНТРАЛЬНОУКРАЇНСЬКИЙ НАУКОВИЙ ЛІЦЕЙ</div><h2 id="tv4-special-title"></h2><p id="tv4-special-description"></p></div>
</main></div><script src="/js/tv4-preview.js"></script></body></html>
