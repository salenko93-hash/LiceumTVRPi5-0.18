name: Verify official release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows launcher safety and failure tests
        shell: pwsh
        run: ./tests/test_installer_powershell.ps1
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_PATH: ${{ github.workspace }}/.preview-tools/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --prefix .preview-tools --no-save --package-lock=false playwright@1.64.1
          npx --prefix .preview-tools playwright install --with-deps chrome
      - name: Privacy, Python, JavaScript and shell checks
        run: |
          python -B tools/check_public_distribution.py
          python -B VERIFY_PROJECT.py
          for file in scripts/*.sh; do bash -n "$file"; done
      - name: Full HD DEMO, timetable, safety and programmed audio checks
        run: |
          node tests/browser_demo_tv_display.cjs
          node tests/browser_tv_display_preview.cjs
          node tests/browser_tv_display_install.cjs
          node tests/browser_air_raid.cjs
      - name: Build verified installation ZIP
        run: |
          python -B tools/build_official_release.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: verified-rpi5
          path: |
            dist/LyceumTV-RPi5-v*.zip
            dist/LyceumTV-RPi5-v*.zip.sha256
          if-no-files-found: error
