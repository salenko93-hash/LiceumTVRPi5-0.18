# Server/supervisor only. Do not copy to the Chromium/Cage kiosk unit.
[Service]
CapabilityBoundingSet=
AmbientCapabilities=
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
# DNS/HTTP(S), systemctl's local bus, hostname -I/getifaddrs (netlink).
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
LockPersonality=true
RestrictSUIDSGID=true
ProtectClock=true
ProtectHostname=true
SystemCallArchitectures=native
# Conservative deny list: retain process creation, signals, OpenSSL and OTA I/O.
# EPERM permits ordinary feature detection/fallback rather than killing Python.
SystemCallFilter=~@clock @module @mount @raw-io @reboot @swap @obsolete @cpu-emulation
SystemCallErrorNumber=EPERM
